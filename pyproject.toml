[project]
name = "kiosk-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.5.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.12",
    "reportlab>=4.2.0",
    "openpyxl>=3.1.5",
    "tzdata>=2024.1"
]

[tool.vercel]
entrypoint = "api/index.py:app"
