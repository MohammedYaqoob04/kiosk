# Local PostgreSQL:  docker compose up -d   then   DATABASE_URL=postgresql://kiosk:kiosk@localhost:5432/kiosk
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: kiosk, POSTGRES_PASSWORD: kiosk, POSTGRES_DB: kiosk }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes: { pgdata: {} }
